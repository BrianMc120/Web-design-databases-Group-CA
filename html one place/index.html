<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supabase Data Display</title>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Supabase JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      defer
    ></script>

    <!-- App script -->
    <script defer>
      const SUPABASE_URL = "https://gzwonzdgrppqajhrcjjd.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6d29uemRncnBwcWFqaHJjampkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NzI5MTUsImV4cCI6MjA5MTE0ODkxNX0.5a7CitgvIY4zZt2u7IdtHtRT9Djqz6aRd6FMJaUoIWo";

      let supabaseClient;
      const defaultTable = "students";
      let currentTable = defaultTable;
      let editingRow = null;
      
      const hiddenColumns = {
        students: ["is_active", "enrolled_date"],
      };

      const tableConfigs = {
        students: { idColumn: "student_id" },
        enrollments: { idColumn: "enrollment_id" },
        modules: { idColumn: "module_id" },
      };

      window.addEventListener("DOMContentLoaded", async () => {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY,
        );
        setupTableSwitcher();
        setupModalClose();
        await loadTable(defaultTable);
      });

      function setupTableSwitcher() {
        document
          .querySelectorAll(".table-switcher button")
          .forEach((button) => {
            button.addEventListener("click", async () => {
              const tableName = button.dataset.table;
              currentTable = tableName;
              setActiveSwitcher(tableName);
              await loadTable(tableName);
            });
          });
      }

      function setupModalClose() {
        const modal = document.getElementById("edit-modal");
        const closeBtn = document.querySelector(".modal-close");
        const cancelBtn = document.getElementById("cancel-btn");

        if (closeBtn) {
          closeBtn.addEventListener("click", () => {
            modal.style.display = "none";
            document.body.style.overflow = "auto";
          });
        }

        if (cancelBtn) {
          cancelBtn.addEventListener("click", () => {
            modal.style.display = "none";
            document.body.style.overflow = "auto";
          });
        }

        window.addEventListener("click", (e) => {
          if (e.target === modal) {
            modal.style.display = "none";
            document.body.style.overflow = "auto";
          }
        });
      }

      function setActiveSwitcher(activeName) {
        document
          .querySelectorAll(".table-switcher button")
          .forEach((button) => {
            button.classList.toggle(
              "active",
              button.dataset.table === activeName,
            );
          });
      }

      function formatColumnName(name) {
        return name
          .replace(/_/g, " ")
          .replace(/\b\w/g, (char) => char.toUpperCase());
      }

      async function loadTable(tableName) {
        const tableHead = document.getElementById("table-head");
        const tableBody = document.getElementById("student-table");
        const statusEl = document.getElementById("status");
        const headerTitle = document.querySelector(".page-header h1");

        headerTitle.textContent =
          tableName.charAt(0).toUpperCase() + tableName.slice(1);
        tableHead.innerHTML = "";
        tableBody.innerHTML = '<tr><td colspan="10">Loading data…</td></tr>';
        statusEl.textContent = "";

        const { data, error } = await supabaseClient
          .from(tableName)
          .select("*");

        if (error) {
          console.error("Error fetching data:", error);
          tableBody.innerHTML = `<tr><td colspan="10">Could not load table \"${tableName}\".</td></tr>`;
          statusEl.textContent = error.message
            ? `${error.message}. Check that the table exists and the name is correct.`
            : "Query failed";
          return;
        }

        if (!data || data.length === 0) {
          tableBody.innerHTML =
            '<tr><td colspan="10">No records found</td></tr>';
          statusEl.textContent =
            "Tip: check the selected table or add rows in the Table Editor.";
          return;
        }

        const hidden = hiddenColumns[tableName] || [];
        const columnNames = Object.keys(data[0]).filter(
          (name) => !hidden.includes(name),
        );
        const headerRow = document.createElement("tr");
        headerRow.innerHTML = columnNames
          .map((name) => `<th>${formatColumnName(name)}</th>`)
          .join("") + "<th>Actions</th>";
        tableHead.appendChild(headerRow);

        tableBody.innerHTML = "";
        data.forEach((rowData) => {
          const row = document.createElement("tr");
          const cellsHTML = columnNames
            .map((column) => `<td>${rowData[column] ?? ""}</td>`)
            .join("");
          const idColumn = tableConfigs[tableName].idColumn;
          const recordId = rowData[idColumn];
          row.innerHTML = cellsHTML + `
            <td class="action-buttons">
              <button class="btn btn-edit" onclick="openEditModal('${tableName}', ${recordId})">Edit</button>
              <button class="btn btn-delete" onclick="deleteRecord('${tableName}', ${recordId})">Delete</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      }

      async function openEditModal(tableName, recordId) {
        const modal = document.getElementById("edit-modal");
        const formContainer = document.getElementById("edit-form-container");
        const modalTitle = document.getElementById("modal-title");

        modalTitle.textContent = `Edit ${formatColumnName(tableName)} Record`;

        const { data, error } = await supabaseClient
          .from(tableName)
          .select("*")
          .eq(tableConfigs[tableName].idColumn, recordId)
          .single();

        if (error) {
          alert("Error loading record: " + error.message);
          return;
        }

        editingRow = { table: tableName, id: recordId, data };
        
        const hidden = hiddenColumns[tableName] || [];
        const fields = Object.keys(data).filter((key) => !hidden.includes(key) && key !== tableConfigs[tableName].idColumn);
        
        let formHTML = "";
        fields.forEach((field) => {
          const label = formatColumnName(field);
          const value = data[field] ?? "";
          formHTML += `
            <div class="form-group">
              <label for="field-${field}">${label}</label>
              <input type="text" id="field-${field}" name="${field}" value="${value}" />
            </div>
          `;
        });

        formHTML += `
          <div class="form-actions">
            <button id="save-btn" class="btn btn-primary">Save Changes</button>
            <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
          </div>
        `;

        formContainer.innerHTML = formHTML;
        
        document.getElementById("save-btn").addEventListener("click", saveRecord);
        document.getElementById("cancel-btn").addEventListener("click", () => {
          modal.style.display = "none";
          document.body.style.overflow = "auto";
        });

        modal.style.display = "block";
        document.body.style.overflow = "hidden";
      }

      async function saveRecord() {
        if (!editingRow) return;

        const formContainer = document.getElementById("edit-form-container");
        const inputs = formContainer.querySelectorAll("input");
        const updates = {};

        inputs.forEach((input) => {
          updates[input.name] = input.value;
        });

        const { error } = await supabaseClient
          .from(editingRow.table)
          .update(updates)
          .eq(tableConfigs[editingRow.table].idColumn, editingRow.id);

        if (error) {
          alert("Error updating record: " + error.message);
          return;
        }

        alert("Record updated successfully!");
        document.getElementById("edit-modal").style.display = "none";
        document.body.style.overflow = "auto";
        await loadTable(editingRow.table);
      }

      async function deleteRecord(tableName, recordId) {
        if (!confirm("Are you sure you want to delete this record? This action cannot be undone.")) {
          return;
        }

        const { error } = await supabaseClient
          .from(tableName)
          .delete()
          .eq(tableConfigs[tableName].idColumn, recordId);

        if (error) {
          alert("Error deleting record: " + error.message);
          return;
        }

        alert("Record deleted successfully!");
        await loadTable(tableName);
      }
    </script>
  </head>

  <body>
    <div class="page-layout">
      <nav class="sidebar">
        <div class="brand">
          <div class="brand-icon">S</div>
          <div>
            <h2>School</h2>
            <p>Live data</p>
          </div>
        </div>

        <ul class="sidebar-links">
          <li><a href="index.html" class="active">Students</a></li>
          <li><a href="courses.html">Courses</a></li>
          <li><a href="teachers.html">Teachers</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>

      <main class="content">
        <header class="page-header">
          <div>
            <h1>Students</h1>
            <p class="page-subtitle">
            </p>
          </div>

          <div class="page-header-actions">
            <div class="table-switcher">
              <button type="button" data-table="students" class="active">
                Students
              </button>
              <button type="button" data-table="enrollments">Enrollments</button>
              <button type="button" data-table="modules">Modules</button>
            </div>
            <button id="add-btn" class="btn btn-add" onclick="openAddModal()">+ Add Record</button>
          </div>
        </header>

        <div class="table-wrapper">
          <table>
            <thead id="table-head"></thead>
            <tbody id="student-table">
              <tr>
                <td colspan="10">Loading data…</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div id="status" class="status"></div>
>
        <div id="edit-modal" class="modal">
          <div class="modal-content">
            <div class="modal-header">
              <h2 id="modal-title">Edit Record</h2>
              <span class="modal-close">&times;</span>
            </div>
            <div id="edit-form-container" class="modal-body">
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
