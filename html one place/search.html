<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #eef1f5;
}

.container {
    display: flex;
}

.sidebar {
    width: 200px;
    height: 100vh;
    background: #1f2a38;
    color: white;
    padding: 20px 15px;
}

.logo-section {
    display: flex;
    align-items: center;
    margin-bottom: 30px;
}

.logo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #7b5bff, #5b6cff);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
    margin-right: 10px;
}

.logo-text {
    font-size: 16px;
    font-weight: 600;
}

.logo-sub {
    font-size: 12px;
    color: #9ca3af;
}

.sidebar nav a {
    display: block;
    padding: 10px 12px;
    margin-bottom: 8px;
    color: #cbd5e1;
    text-decoration: none;
    border-radius: 10px;
    font-size: 14px;
}

.sidebar nav a.active {
    background: #334155;
    color: white;
}

.sidebar nav a:hover {
    background: #2f3e52;
    color: white;
}

.content {
    flex: 1;
    padding: 25px;
}

h1 {
    margin: 0;
}

.subtitle {
    color: #666;
    margin-bottom: 25px;
}

.filter-bar {
    margin-bottom: 15px;
}

.filter-bar input,
.filter-bar select {
    padding: 8px;
    margin-right: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.table-container {
    background: white;
    border-radius: 0%;
    overflow: hidden;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
  padding: 12px 16px;
  text-align: left;
  border-bottom: 1px solid #ddd;
}

th {
  background: #5e68ff;
  color: #ffffff;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

tr:hover {
  background: #95e6f4;
}

td {
    padding: 14px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

tr:hover {
    background: #f9fafb;
}
</style>
</head>

<body>

<div class="container">

    <div class="sidebar">

        <div class="logo-section">
            <div class="logo-icon">S</div>
            <div>
                <div class="logo-text">School</div>
                <div class="logo-sub">Live data</div>
            </div>
        </div>

        <nav>
            <a href="search.html" class="active">Search</a>
            <a href="index.html">Students</a>
            <a href="courses.html">Courses</a>
            <a href="teachers.html">Teachers</a>
            <a href="about.html">About</a>
        </nav>

    </div>

    <div class="content">

        <h1>Search or Filter</h1>
        <div class="subtitle">
            Search and filter courses below.
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="Search courses...">

            <select id="departmentFilter">
                <option value="">All Departments</option>
                <option value="Computing">Computing</option>
                <option value="Design">Design</option>
                <option value="Engineering">Engineering</option>
            </select>

            <select id="levelFilter">
                <option value="">All Levels</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
            </select>
        </div>

        <div class="table-container">
            <table id="courseTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Level</th>
                        <th>Department</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </div>
</div>

<script>
let allCourses = [];

async function loadCoursesFromFile() {
    const response = await fetch("courses.txt");
    const text = await response.text();

    allCourses = text
        .split("\n")
        .filter(line => line.trim())
        .map(line => {
            const [id, code, name, level, dept, desc] = line.split(",");
            return { id, code, name, level, dept, desc };
        });

    renderTable(allCourses);
}

function renderTable(data) {
    const tbody = document.querySelector("#courseTable tbody");
    tbody.innerHTML = "";

    data.forEach(course => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${course.id}</td>
            <td>${course.code}</td>
            <td>${course.name}</td>
            <td>${course.level}</td>
            <td>${course.dept}</td>
            <td>${course.desc}</td>
        `;

        tbody.appendChild(row);
    });
}

function filterTable() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    const dept = document.getElementById("departmentFilter").value;
    const level = document.getElementById("levelFilter").value;

    const filtered = allCourses.filter(c => {
        const matchSearch =
            c.code.toLowerCase().includes(search) ||
            c.name.toLowerCase().includes(search);

        const matchDept = !dept || c.dept === dept;
        const matchLevel = !level || c.level === level;

        return matchSearch && matchDept && matchLevel;
    });

    renderTable(filtered);
}

document.getElementById("searchInput").addEventListener("keyup", filterTable);
document.getElementById("departmentFilter").addEventListener("change", filterTable);
document.getElementById("levelFilter").addEventListener("change", filterTable);

window.onload = loadCoursesFromFile;
</script>

</body>
</html>
