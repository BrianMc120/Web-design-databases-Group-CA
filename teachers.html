<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teachers</title>

    <link rel="stylesheet" href="styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

    <script defer>
      const SUPABASE_URL = "https://gzwonzdgrppqajhrcjjd.supabase.co";
      const SUPABASE_ANON_KEY =
        "YOUR_KEY_HERE"; // <----- Key Here!!!

      let supabaseClient;

      
      const defaultTable = "teachers";

      const hiddenColumns = {
        students: ["is_active", "enrolled_date"],
        teachers: []
      };

      window.addEventListener("DOMContentLoaded", async () => {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );

        console.log("Supabase connected (teachers page)");

        await loadTable(defaultTable);
      });

      function formatColumnName(name) {
        return name
          .replace(/_/g, " ")
          .replace(/\b\w/g, (char) => char.toUpperCase());
      }

      async function loadTable(tableName) {
        const tableHead = document.getElementById("table-head");
        const tableBody = document.getElementById("student-table");
        const statusEl = document.getElementById("status");
        const headerTitle = document.querySelector(".page-header h1");

        headerTitle.textContent = "Teachers";

        tableHead.innerHTML = "";
        tableBody.innerHTML = '<tr><td colspan="8">Loading data…</td></tr>';
        statusEl.textContent = "";

        const { data, error } = await supabaseClient
          .from(tableName)
          .select("*");

        if (error) {
          console.error("Error fetching data:", error);
          tableBody.innerHTML = `<tr><td colspan="8">Could not load teachers.</td></tr>`;
          statusEl.textContent = error.message;
          return;
        }

        if (!data || data.length === 0) {
          tableBody.innerHTML =
            '<tr><td colspan="8">No teachers found</td></tr>';
          return;
        }

        const hidden = hiddenColumns[tableName] || [];

        const columnNames = Object.keys(data[0]).filter(
          (name) => !hidden.includes(name)
        );

        const headerRow = document.createElement("tr");
        headerRow.innerHTML = columnNames
          .map((name) => `<th>${formatColumnName(name)}</th>`)
          .join("");
        tableHead.appendChild(headerRow);

        tableBody.innerHTML = "";

        data.forEach((rowData) => {
          const row = document.createElement("tr");
          row.innerHTML = columnNames
            .map((column) => `<td>${rowData[column] ?? ""}</td>`)
            .join("");
          tableBody.appendChild(row);
        });

        console.log("Teachers loaded");
      }
    </script>
  </head>

  <body>
    <div class="page-layout">
      <nav class="sidebar">
        <div class="brand">
          <div class="brand-icon">S</div>
          <div>
            <h2>School</h2>
            <p>Live data</p>
          </div>
        </div>

        <ul class="sidebar-links">
          <li><a href="index.html">Students</a></li>
          <li><a href="courses.html">Courses</a></li>
          <li><a href="teachers.html" class="active">Teachers</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>

      <main class="content">
        <header class="page-header">
          <div>
            <h1>Teachers</h1>
            <p class="page-subtitle">
              View all teacher data from the database.
            </p>
          </div>
        </header>

        <table>
          <thead id="table-head"></thead>
          <tbody id="student-table">
            <tr>
              <td colspan="8">Loading data…</td>
            </tr>
          </tbody>
        </table>

        <div id="status" class="status"></div>
      </main>
    </div>
  </body>
</html>
