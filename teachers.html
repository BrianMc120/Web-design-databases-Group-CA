<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teachers</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background: #f4f6f9;
      }

      .navbar {
        background: #1e293b;
        color: white;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .navbar h2 {
        font-weight: 600;
      }

      .nav-links a {
        color: #cbd5f5;
        margin-left: 20px;
        text-decoration: none;
        font-weight: 500;
        transition: 0.2s;
      }

      .nav-links a:hover {
        color: white;
      }

      .nav-links .active {
        color: #38bdf8;
      }

      .container {
        padding: 30px;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.05);
      }

      .card h1 {
        margin-bottom: 10px;
      }

      .subtitle {
        color: #64748b;
        margin-bottom: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #f1f5f9;
        text-align: left;
        padding: 12px;
        font-weight: 600;
      }

      td {
        padding: 12px;
        border-bottom: 1px solid #e2e8f0;
      }

      tr:hover {
        background: #f9fafb;
      }

      .status {
        margin-top: 15px;
        color: #ef4444;
      }
    </style>

    <script defer>
      const SUPABASE_URL = "https://vititdcdymsensipbkqg.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_HyAU1xwNCOssf2TCFvI4SQ_FNxgBUmS";

      let supabaseClient;
      const defaultTable = "teachers";

      window.addEventListener("DOMContentLoaded", async () => {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );

        await loadTable(defaultTable);
      });

      function formatColumnName(name) {
        return name
          .replace(/_/g, " ")
          .replace(/\b\w/g, (c) => c.toUpperCase());
      }

      async function loadTable(tableName) {
        const tableHead = document.getElementById("table-head");
        const tableBody = document.getElementById("table-body");
        const statusEl = document.getElementById("status");

        tableHead.innerHTML = "";
        tableBody.innerHTML = "<tr><td>Loading...</td></tr>";
        statusEl.textContent = "";

        const { data, error } = await supabaseClient
          .from(tableName)
          .select("*");

        if (error) {
          tableBody.innerHTML = "<tr><td>Error loading data</td></tr>";
          statusEl.textContent = error.message;
          return;
        }

        if (!data || data.length === 0) {
          tableBody.innerHTML = "<tr><td>No teachers found</td></tr>";
          return;
        }

        const columns = Object.keys(data[0]);

        const headerRow = document.createElement("tr");
        headerRow.innerHTML = columns
          .map((col) => `<th>${formatColumnName(col)}</th>`)
          .join("");
        tableHead.appendChild(headerRow);

        tableBody.innerHTML = "";

        data.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = columns
            .map((col) => `<td>${row[col] ?? ""}</td>`)
            .join("");
          tableBody.appendChild(tr);
        });
      }
    </script>
  </head>

  <body>
    <div class="navbar">
      <h2>School Dashboard</h2>
      <div class="nav-links">
        <a href="index.html">Students</a>
        <a href="courses.html">Courses</a>
        <a href="teachers.html" class="active">Teachers</a>
        <a href="about.html">About</a>
      </div>
    </div>

    <div class="container">
      <div class="card">
        <h1>Teachers</h1>
        <p class="subtitle">View all teachers in the system</p>

        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body">
            <tr><td>Loading...</td></tr>
          </tbody>
        </table>

        <div id="status" class="status"></div>
      </div>
    </div>
  </body>
</html>
